<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Purpose Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-xl shadow-lg max-w-lg w-full border border-gray-700">
        <h1 class="text-4xl font-bold text-center mb-2">Multi-Purpose <span class="text-pink-500">Converter</span></h1>
        <p class="text-gray-400 text-center mb-8">Tukar video atau playlist YouTube kepada fail MP3 kualiti tertinggi secara percuma.</p>

        <!-- Menggunakan POST form standard -->
        <form method="POST" action="/">
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-300 mb-2">URL YouTube</label>
                <input type="text" name="url" required class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-pink-500 text-gray-100" placeholder="Paste link video atau playlist di sini...">
            </div>

            <!-- Butang yang akan bertukar teks bila ditekan untuk elak klik berkali-kali -->
            <button type="submit" onclick="this.innerHTML='Sedang Memproses... Sila Tunggu';" class="w-full bg-gradient-to-r from-blue-600 to-pink-600 hover:from-blue-700 hover:to-pink-700 text-white font-bold py-3 px-4 rounded-lg transition-all">
                Convert to MP3
            </button>
        </form>

        <!-- Paparan ralat dari backend Python (jika ada) -->
        {% if error %}
        <div class="mt-6 bg-red-900/30 border border-red-500 text-red-300 px-4 py-3 rounded-lg text-sm">
            <p>{{ error }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
