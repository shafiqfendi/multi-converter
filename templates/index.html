<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Purpose Converter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(to right, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Loading Spinner CSS */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container -->
    <div class="w-full max-w-2xl bg-gray-800 rounded-2xl shadow-2xl p-8 md:p-12 border border-gray-700">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight mb-2">
                Multi-Purpose <span class="gradient-text">Converter</span>
            </h1>
            <p class="text-gray-400 text-sm md:text-base">
                Tukar video atau playlist YouTube kepada fail MP3 kualiti tertinggi secara percuma.
            </p>
        </div>

        <!-- Input Area -->
        <div class="space-y-6">
            <div>
                <label for="yt-link" class="block text-sm font-medium text-gray-300 mb-2">URL YouTube</label>
                <input type="text" id="yt-link" placeholder="Paste link video atau playlist di sini..." 
                    class="w-full px-4 py-3 rounded-lg bg-gray-900 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200">
            </div>

            <!-- Action Button -->
            <button id="convert-btn" onclick="startConversion()"
                class="w-full bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-700 hover:to-pink-700 text-white font-semibold py-3 px-4 rounded-lg shadow-lg transform transition hover:scale-[1.02] focus:outline-none">
                Convert to MP3
            </button>
        </div>

        <!-- Status Area (Hidden by default) -->
        <div id="status-area" class="mt-8 hidden">
            <div class="bg-gray-900 rounded-lg p-4 border border-gray-700 flex items-center justify-between">
                <div class="flex items-center">
                    <div id="loading-spinner" class="spinner"></div>
                    <span id="status-text" class="text-indigo-400 font-medium">Sedang memproses...</span>
                </div>
            </div>
            <p class="text-xs text-gray-500 mt-2 text-center">Jangan tutup tab ini sehingga fail selesai dimuat turun.</p>
        </div>
    </div>

    <!-- Footer -->
    <p class="mt-8 text-gray-500 text-sm">
        Dibina untuk kegunaan peribadi. Tiada Iklan. Tiada Limit.
    </p>

    <!-- Javascript Logic -->
    <script>
        async function startConversion() {
            const urlInput = document.getElementById('yt-link').value.trim();
            const btn = document.getElementById('convert-btn');
            const statusArea = document.getElementById('status-area');
            const statusText = document.getElementById('status-text');
            const spinner = document.getElementById('loading-spinner');

            if (!urlInput) {
                alert("Tolong masukkan link YouTube terlebih dahulu!");
                return;
            }

            // Update UI to loading state
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            statusArea.classList.remove('hidden');
            statusText.textContent = "Sedang fetching fail dari YouTube... (Playlist ambil masa lama sikit)";
            statusText.className = "text-indigo-400 font-medium";
            spinner.style.display = "inline-block";

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                if (response.ok) {
                    // Start downloading the file
                    statusText.textContent = "Berjaya! Sedang muat turun fail...";
                    statusText.className = "text-green-400 font-medium";
                    spinner.style.display = "none";

                    // Create Blob and trigger download
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    
                    // Cuba dapatkan nama fail dari header jika ada
                    let filename = 'Download.mp3';
                    const disposition = response.headers.get('Content-Disposition');
                    if (disposition && disposition.includes('filename=')) {
                        let filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                        let matches = filenameRegex.exec(disposition);
                        if (matches != null && matches[1]) { 
                            filename = matches[1].replace(/['"]/g, '');
                        }
                        // Decode URL encoded characters (macam space dll)
                        filename = decodeURIComponent(filename);
                    }
                    
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    
                } else {
                    const errData = await response.json();
                    throw new Error(errData.error || "Ralat tidak diketahui.");
                }
            } catch (error) {
                statusText.textContent = "Ralat: " + error.message;
                statusText.className = "text-red-400 font-medium";
                spinner.style.display = "none";
            } finally {
                // Reset UI button
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                // clear input (optional)
                document.getElementById('yt-link').value = '';
            }
        }
    </script>
</body>
</html>
